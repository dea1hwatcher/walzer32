[package]
name = "transd-rt"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transd-core = { path = "../transd-core" }
transd-decoder = { path = "../transd-decoder" }
transd-ir = { path = "../transd-ir" }
transd-emitter-a64 = { path = "../transd-emitter-a64" }
transd-interp = { path = "../transd-interp" }
transd-elf = { path = "../transd-elf" }
byteorder.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory"] }
