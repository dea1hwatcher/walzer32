[workspace]
resolver = "2"
members = [
    "crates/walzer32-core",
    "crates/walzer32-decoder",
    "crates/walzer32-ir",
    "crates/walzer32-emitter-a64",
    "crates/walzer32-interp",
    "crates/walzer32-rt",
    "crates/walzer32-elf",
    "crates/walzer32-bridge",
    "crates/walzer32-apk",
    "crates/walzer32-cli",
    "crates/walzer32-android",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Walzer32 Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bitflags = "2.8"
thiserror = "2.0"
byteorder = "1.5"

# ─────────────────────────────────────────────────────────────────────────────
# Android deployment profile — minimize binary size for on-device .so
# Usage: cargo build --profile release-android --target aarch64-linux-android
# ─────────────────────────────────────────────────────────────────────────────
[profile.release-android]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
